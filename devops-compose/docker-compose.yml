services:
  db:
    image: mysql:8.0
    container_name: devops-db
    environment:
      MYSQL_DATABASE: devops_db
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - devops-db-data to /var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - devops-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: devops-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE = docker
      - DB_URL = jdbc:mysql://devops-db:3306/devopsapp?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME = root
      - DB_PASSWORD = rootpassword
      - DDL_AUTO = update

    depends_on:
      - db
      - 


  networks:



  volumes:

